# ============================================================
#  Prefix: Ctrl-b  (most things below are prefix-free on Option/Alt)
# ============================================================
set -g prefix C-b
bind C-b send-prefix

# ---- General ----
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10
set -g repeat-time 600
set -g focus-events on
set -g set-clipboard on            # copy in tmux -> macOS clipboard via OSC 52
set -g allow-passthrough on        # lets image/notification escapes through
set -g set-titles on
set -g set-titles-string "#S / #W"
set -g display-time 2000
setw -g aggressive-resize on
setw -g mode-keys vi               # vim keys in copy/scroll mode
set -g status-keys vi              # vim keys in the command prompt (prefix :)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# ============================================================
#  Option (Meta) bindings — no prefix needed
# ============================================================

# Split: Option -  (top/bottom)   Option |  or Option \  (side by side)
bind -n M--  split-window -v -c "#{pane_current_path}"
bind -n M-|  split-window -h -c "#{pane_current_path}"
bind -n M-\\ split-window -h -c "#{pane_current_path}"

# Move between panes: Option h j k l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes: Option u i o p  (left, down, up, right)
bind -n M-u resize-pane -L 5
bind -n M-i resize-pane -D 3
bind -n M-o resize-pane -U 3
bind -n M-p resize-pane -R 5

# Prev / next window: Option [  ]
bind -n M-[ previous-window
bind -n M-] next-window

# Jump to window: Option 1..9, Option 0 = window 10 (does nothing if it doesn't exist)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# Zoom pane: Option z
bind -n M-z resize-pane -Z

# Scroll / copy mode: Option s  (same as prefix [ ; press Option s or q again to exit)
bind -n M-s copy-mode
bind -T copy-mode-vi M-s send -X cancel

# Type into all panes at once: Option x  (toggle)
bind -n M-x setw synchronize-panes \; display "sync-panes #{?synchronize-panes,ON,OFF}"

# Rename window: Option ,
bind -n M-, command-prompt -I "#W" -p "rename window:" "rename-window '%%'"

# New window: Option n   |   Kill pane: Option w (asks first)
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-w confirm-before -p "kill pane? (y/n)" kill-pane

# ============================================================
#  Prefix bindings (kept as fallbacks)
# ============================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind S command-prompt -p "new session:" "new-session -s '%%'"
bind < swap-window -d -t -1
bind > swap-window -d -t +1

# Ctrl-h/j/k/l moves across tmux panes AND vim splits (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind C-l send-keys C-l   # prefix + Ctrl-l clears the screen

# Vi-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ============================================================
#  Look
# ============================================================
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 30
set -g status-left "#[bold] #S #[default]"
# Shows ZOOM / SYNC badges when active
set -g status-right "#{?pane_in_mode,#[bg=#98971a fg=#282828 bold] SCROLL #[default] ,}#{?window_zoomed_flag,#[bg=#458588 fg=#282828 bold] ZOOM #[default] ,}#{?synchronize-panes,#[bg=#cc241d fg=#ebdbb2 bold] SYNC #[default] ,}#{?client_prefix,#[bg=#d79921 fg=#282828 bold] ^B #[default] ,} %Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, 🔍,} "
setw -g window-status-current-style "bg=#d79921,fg=#282828,bold"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"
set -g message-style "bg=#d79921,fg=#282828"
setw -g pane-border-status off
